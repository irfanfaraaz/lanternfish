name: Bug report
description: Something in Lanternfish doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a site with domain example.com
        2. Load a page with the script tag
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you deployed (`git rev-parse --short HEAD`), or the lanternfish-next version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `bunx wrangler tail` or the browser console, if relevant. Remove anything private.
      render: text
